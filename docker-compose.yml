version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: swarm_memory
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  research_agent:
    build: . # Tells Docker to build the agent using your Dockerfile
    container_name: swarm_agent
    depends_on:
      - mongodb # Ensures the database starts before the agent
    environment:
      # We pass the token from your Mac's terminal into the container
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN} 

volumes:
  mongo_data: