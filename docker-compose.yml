version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: swarm_memory
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  research_agent:
    build: . 
    container_name: swarm_agent
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - ./output:/app/output

volumes:
  mongo_data: