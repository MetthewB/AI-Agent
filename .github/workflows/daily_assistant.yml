name: Daily Personal Assistant

on:
  schedule:
    - cron: '00 2 * * *'  # Morning Briefing
    - cron: '15 2 * * *'  # Financial Analyst
    - cron: '30 2 * * *'  # Cat Break
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-morning-briefing:
    if: github.event.schedule == '05 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Morning Briefing
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_BOT: ${{ secrets.OPENROUTER_API_KEY_BOT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPLE_CALENDAR_URL: ${{ secrets.APPLE_CALENDAR_URL }}
          PYTHONUNBUFFERED: 1
        run: python scheduled_jobs/morning_briefing.py

  run-financial-analyst:
    if: github.event.schedule == '00 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Financial Analyst
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_BOT: ${{ secrets.OPENROUTER_API_KEY_BOT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: 1
        run: python scheduled_jobs/financial_analyst.py

  run-cat-break:
    if: github.event.schedule == '00 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Cat Break
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: 1
        run: python scheduled_jobs/cat_break.py